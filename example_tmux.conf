# Linux-DEX tmux starter (next-3.9)
#
# Separate pane borders are the default. Copy to ~/.tmux.conf or
# ~/.config/tmux/tmux.conf and tweak.

# True color when the outer terminal supports it
set -as terminal-features ",xterm*:RGB,alacritty*:RGB,kitty*:RGB"

# Flagship: full border around each pane (also: separate-active, joined)
# Prefix+B cycles this at runtime.
set -g pane-border-type separate

# Builtin theme (auto | light | dark | terminal)
set -g theme auto

# Optional: show pane titles (SCRATCH / float badges use pane-border-format)
# set -g pane-border-status top

# Mouse is on by default in this build; keep an explicit toggle handy
# set -g mouse on

# Useful reminders (defaults already bound):
#   Prefix+?     grouped key cheatsheet (which-key); ? again lists all keys
#   Prefix+Tab   fuzzy window switcher
#   Prefix+BTab  fuzzy session switcher
#   Prefix+S     fuzzy session picker (activity · path)
#   Prefix+P     fuzzy command palette
#   Prefix+u     toggle floating scratch (focus if hidden, kill if active)
#                toggle-scratch -s small|medium|large
#   Prefix+F     hint-jump URLs/paths/hashes (type label, Enter to copy)
#   Prefix+M-f   hint-jump and open (browser for URLs, editor for paths)
#   Prefix+C-s   save-layout (reports session/window/pane counts)
#   Prefix+C-r   load-layout
#   Prefix+B     cycle pane-border-type
#   Prefix+h/j/k/l   pane focus
#   Prefix+H/J/K/L   pane swap
#   Prefix+*     new floating pane
#   Prefix+@     float/tile toggle
#   Prefix+C     customize options
#
# Commands (also usable from Prefix+: ):
#   save-layout [-f path]
#   load-layout [-f path]
#   upgrade-server [-y] [-f /path/to/new/tmux]
#     Saves layouts, writes an autoload marker, stops the server.
#     Pane processes exit; reattach with the new binary to restore layouts.
#   toggle-scratch [-s small|medium|large]
